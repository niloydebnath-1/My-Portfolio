<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Dark background container -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0a0a0f" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#13131d" opacity="0.8" />
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#border-gradient)" stroke-width="2" />

  <!-- ND Text -->
  <text 
    x="32" 
    y="43" 
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="30" 
    fill="url(#cyan-gradient)" 
    text-anchor="middle"
    letter-spacing="-1"
  >ND</text>
</svg>
